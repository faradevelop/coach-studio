name: coach_studio
description: "A Workout Builder Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# ─────────────────────────────────────────────
# Dependencies
# ─────────────────────────────────────────────

dependencies:
  flutter:
    sdk: flutter

  # ─────────────── State Management ───────────────
  flutter_bloc: ^9.1.1

  # ─────────────── Dependency Injection ───────────────
  get_it: ^9.2.1

  # ─────────────── Routing ───────────────
  go_router: ^17.3.0

  # ─────────────── Networking ───────────────
  http: ^1.2.2

  # ─────────────── PDF & Printing ───────────────
  pdf: ^3.13.0
  printing: ^5.15.0

  # ─────────────── Localization & Date ───────────────
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shamsi_date: ^1.1.1

  # ─────────────── Icons ───────────────
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  iconsax: ^0.0.8

# ─────────────────────────────────────────────
# Development Dependencies
# ─────────────────────────────────────────────

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# ─────────────────────────────────────────────
# Flutter Configuration
# ─────────────────────────────────────────────

flutter:
  uses-material-design: true

  # ─────────────── Assets ───────────────
  assets:
    - assets/images/

  # ─────────────── Fonts ───────────────
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

